<!--
  Content-Security-Policy: Skripte nur von hier (auch Firebase, selbst gehostet unter vendor/) und
  von cdn.jsdelivr.net/staticimgly.com (Freistellung und – Experiment – Texterkennung, beide erst
  bei Bedarf geladen; brauchen WebAssembly und für die Freistellung 'unsafe-eval' – ohne das schlägt
  sie mit EvalError fehl, getestet mit tests/e2e/csp-cutout.mjs und csp-ocr.mjs). Eingeschleuste
  Inline-Skripte und onerror=-Handler bleiben blockiert.
  App Check (firebase-config.js → appCheckSiteKey) braucht zusätzlich in script-src
  "https://www.google.com https://www.gstatic.com" – siehe STAND.md.
  Falls nach einem Update etwas nicht mehr geht: Browser-Konsole zeigt "Refused to …" mit der
  blockierten Adresse.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://staticimgly.com 'wasm-unsafe-eval' 'unsafe-eval' blob:; connect-src 'self' https://*.googleapis.com https://www.google.com https://*.firebaseapp.com https://cdn.jsdelivr.net https://staticimgly.com data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; frame-src https://*.firebaseapp.com https://www.google.com https://recaptcha.google.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
